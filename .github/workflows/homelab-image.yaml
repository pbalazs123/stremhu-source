name: Homelab image (ghcr)

# Fork only: tests, then builds ghcr.io/<owner>/stremhu-source from the homelab branch.
# Tags: "homelab" (moving) and "<upstream version>-hl.<run number>" (fixed, for deploys).
# Uses the repo's GITHUB_TOKEN; no Docker Hub secrets needed.

concurrency:
  group: homelab-image-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - homelab
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  server:
    name: Server
    uses: ./.github/workflows/reusable-server-test-build.yaml
    with:
      working-directory: ./server

  client:
    name: Client
    uses: ./.github/workflows/reusable-client-test-build.yaml
    with:
      working-directory: ./client

  build-and-push:
    name: Build and push to ghcr
    needs:
      - server
      - client
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        name: Docker Buildx

      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          echo "value=${base}-hl.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and Publish
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/stremhu-source:homelab
            ghcr.io/${{ steps.version.outputs.owner }}/stremhu-source:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
